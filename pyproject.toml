[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "alpamayo-carla-bridge"
version = "0.2.0"
description = "Importable Alpamayo R1, 1.5, 2 Edge and 2 Super bridge for CARLA"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pyyaml>=6.0"]

[project.optional-dependencies]
edge = ["alpamayo2-edge @ git+https://github.com/NVlabs/alpamayo2-edge.git@02f55a7aeabc1a2b9f7a80445c08e40bddc89f5e"]
nano-super = ["torch==2.8.0", "torchvision==0.23.0", "transformers==4.57.1",
              "accelerate>=1.12.0", "numpy>=2.0", "einops>=0.8.1", "hydra-core>=1.3.2",
              "scipy>=1.16.0", "colorlog>=6.0", "pillow>=12.0"]
carla = ["carla==0.9.16"]
video = ["pillow>=10.0", "matplotlib>=3.8"]
test = ["pytest>=8.0", "torch==2.8.0"]

[project.scripts]
alpamayo-carla-drive = "bridge.driver:main"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["bridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["edge: requires the Edge runtime", "nano_super: requires the Nano/Super runtime"]
